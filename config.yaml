timezone: Europe/Madrid

upv:
  entry_url: https://intranet.upv.es/pls/soalu/est_intranet.Ni_portal_n?P_IDIOMA=c
  session_check_url: https://intranet.upv.es/pls/soalu/est_intranet.Ni_portal_n?P_IDIOMA=c

window:
  weekday: saturday
  opens_at: "10:00:00"
  closes_at: "10:03:00"
  retry_interval_seconds: 1.5

# The UPV sports activity whose weekly group table gets scraped and booked
# against. Run `python -m upv_auto list-groups` to see the current state of
# every group for this activity (useful for picking group codes below).
activity:
  name: MUSCULACION
  campus: V
  tipoact: "6894"
  codacti: "21948"

# Preferred group first, then alternatives tried in order if a preferred one
# is taken. Group codes look like "MUS074" (see `list-groups`).
slots:
  - group_code: MUS074
  - group_code: MUS075
