[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upv-auto"
version = "0.1.0"
description = "Automates booking a UPV sports facility slot: Playwright handles CAS login, httpx performs the fast booking requests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned: the CI browser cache is keyed on this file, so the version must not float.
    "playwright==1.62.0",
    "httpx>=0.28,<0.29",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.115",
    "httpx>=0.28,<0.29",
    "uvicorn>=0.30",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
multiuser = [
    "pynacl>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]
