name: Book UPV slot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Command to run"
        type: choice
        options:
          - book
          - check-login
          - list-groups
        default: book
      now:
        description: "book only: start immediately instead of waiting for the window (testing)"
        type: boolean
        default: false
      groups:
        description: "book only: space-separated group codes overriding config.yaml, e.g. MUS075 MUS074"
        type: string
        default: ""

concurrency:
  group: book
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install .

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run
        env:
          UPV_USERNAME: ${{ secrets.UPV_USERNAME }}
          UPV_PASSWORD: ${{ secrets.UPV_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          # Inputs go through env vars, never interpolated into the script (avoids injection).
          MODE: ${{ inputs.mode }}
          NOW: ${{ inputs.now }}
          GROUPS: ${{ inputs.groups }}
        run: |
          args=("$MODE")
          if [ "$MODE" = "book" ]; then
            [ "$NOW" = "true" ] && args+=(--now)
            for code in $GROUPS; do args+=(--group "$code"); done
          fi
          python -m upv_auto "${args[@]}"

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/
          retention-days: 3
