name: Deploy Pages

# Builds `web/` and publishes it to GitHub Pages (platform-operations spec:
# "GitHub Pages Hosting"). Uses the official Pages actions end to end, never
# a manual `gh-pages` branch push. The Supabase URL/anon key and the sealing
# public key/key id are public-by-design (the anon key is RLS-scoped, the
# sealing key is a public key), but still come from repo secrets, never
# hardcoded here.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # `configure-pages` derives this repo's Pages project path (e.g.
          # `/upv-auto/`); Vite's `base` must match it (`vite.config.ts`).
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SEAL_PUBLIC_KEY: ${{ secrets.VITE_SEAL_PUBLIC_KEY }}
          VITE_SEAL_KEY_ID: ${{ secrets.VITE_SEAL_KEY_ID }}
        run: npm run build --prefix web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
